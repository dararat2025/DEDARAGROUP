<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DEDARAGROUP builds trusted solutions across food, wellbeing, technology, creativity, and sustainable living.">
    <meta name="theme-color" content="#08111f">
    <title>DEDARAGROUP | Endless Trust. Shared Progress.</title>
    <style>
        :root {
            --page-bg: #071a2c;
            --panel-bg: rgba(17, 31, 48, 0.96);
            --red: #ef6b6b;
            --blue: #3b8edb;
            --navy: #1d2f49;
            --border: rgba(158, 203, 255, 0.6);
            --text: #f4f9ff;
            --code: #67aaf3;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--page-bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
        }

        .page-shell {
            width: min(100%, 1500px);
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .button-row {
            display: flex;
            align-items: center;
            gap: 24px;
            width: 100%;
        }

        .pill {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            border-radius: 999px;
            padding: 18px 26px;
            font-weight: 700;
            font-size: clamp(2rem, 2.1vw, 4rem);
            letter-spacing: -0.04em;
            line-height: 1.1;
            color: var(--text);
            text-decoration: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
            white-space: nowrap;
        }

        .pill-red {
            flex: 0 0 36.5%;
            background: var(--red);
        }

        .pill-blue {
            flex: 0 0 31.5%;
            background: var(--blue);
        }

        .pill-dark {
            flex: 0 0 31.5%;
            background: var(--navy);
            border: 2px solid var(--border);
        }

        .code-line {
            margin-top: 8px;
            padding-left: 4px;
            color: var(--code);
            font-size: clamp(1.5rem, 2vw, 3.1rem);
            line-height: 1.3;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            letter-spacing: -0.02em;
            word-wrap: break-word;
        }

        @media (max-width: 980px) {
            .button-row {
                flex-direction: column;
                align-items: stretch;
            }

            .pill,
            .pill-red,
            .pill-blue,
            .pill-dark {
                flex: 1 1 auto;
                width: 100%;
                min-height: 110px;
                white-space: normal;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="button-row" aria-label="Quick contact links">
            <a class="pill pill-red" href="https://www.amazon.com/s?k=dararat+lorimer" target="_blank" rel="noopener noreferrer">Find us on Amazon</a>
            <a class="pill pill-blue" href="https://www.youtube.com/results?search_query=peterchannel67" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
            <a class="pill pill-dark" href="mailto:info@dedaragroup.com">Email DEDARAGROUP</a>
        </div>

        <div class="code-line">class="" href="Whatsapp Business: +447982966624"</div>
    </div>
</body>
</html>
